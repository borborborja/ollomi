# R8 processes the complete Flutter application and its transitive Android
# dependencies during a production build. 2 GiB is insufficient on a clean
# GitHub runner and causes minifyProdReleaseWithR8 to run out of heap.
org.gradle.jvmargs=-Xmx4096M
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
android.enableR8=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

org.gradle.workers.max=1

kotlin.compiler.execution.strategy=in-process
