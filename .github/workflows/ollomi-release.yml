name: Publish Ollomi

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ollomi-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-tests:
    name: Test self-hosted backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse new oversized repository files
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/check_new_large_files.sh "$BASE_SHA"
      - name: Build the backend test image
        run: docker build -f deploy/Dockerfile -t ollomi-backend:local .
      - name: Run backend contract tests
        run: |
          docker run --rm \
            -e OLLOMI_SECRET_KEY=ci-test-secret-key-that-is-at-least-32-characters \
            -v "$PWD:/work:ro" \
            -w /work \
            ollomi-backend:local \
            sh -ec 'pip install --user pytest==8.3.5 pytest-asyncio==0.26.0 respx==0.22.0 && PYTHONPATH=backend python -m pytest backend/selfhost/tests -q -p no:cacheprovider'
      - name: Start the copyable external or LAN Compose stack
        env:
          OLLOMI_ENV_FILE: .env.example
          OLLOMI_PORT: '18080'
          OLLOMI_SECRET_KEY: ci-compose-contract-secret-key-with-at-least-32-characters
        run: |
          docker compose --project-name ollomi-ci-external --env-file .env.example up -d --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health/ready; then
              python3 - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:18080/"
          with urllib.request.urlopen(base + "v1/server-info", timeout=10) as response:
              info = json.load(response)
          assert info["authentication"] == "local"
          assert info["protocol_version"] == 1
          assert info["model_selection_allowed"] is False

          login = urllib.request.Request(
              base + "v1/auth/login",
              data=json.dumps({
                  "email": "admin@example.com",
                  "password": "CHANGE_ME_A_LONG_UNIQUE_PASSWORD",
              }).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(login, timeout=10) as response:
              session = json.load(response)
          status = urllib.request.Request(
              base + "v1/ai-status",
              headers={"Authorization": "Bearer " + session["access_token"]},
          )
          with urllib.request.urlopen(status, timeout=10) as response:
              profiles = json.load(response)
          for purpose in ("stt", "chat", "embedding"):
              assert profiles[purpose]["managed_by_env"] is True
              assert profiles[purpose]["selection_allowed"] is False
              assert len(profiles[purpose]["profiles"]) == 1
          PY
              exit 0
            fi
            echo "Waiting for external Compose backend (${attempt}/30)"
            sleep 2
          done
          docker compose --project-name ollomi-ci-external --env-file .env.example ps
          docker compose --project-name ollomi-ci-external --env-file .env.example logs
          exit 1
      - name: Remove the external or LAN Compose stack
        if: always()
        env:
          OLLOMI_ENV_FILE: .env.example
          OLLOMI_PORT: '18080'
          OLLOMI_SECRET_KEY: ci-compose-contract-secret-key-with-at-least-32-characters
        run: docker compose --project-name ollomi-ci-external --env-file .env.example down --volumes --remove-orphans

  android-tests:
    name: Test Android app
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          cache: true
      - name: Verify that Android does not reintroduce Firebase
        run: |
          ! rg -n -i 'com\.google\.gms|firebase|crashlytics|google-services' \
            app/android app/pubspec.yaml app/pubspec.lock
      - name: Verify that core app traffic has no upstream Omi authority
        run: |
          ! rg -n -i 'api\.omi\.me|parakeet\.omiapi\.com|affiliate\.omi\.me|h\.omi\.me|www\.omi\.me' \
            app/lib/backend/http app/lib/models/stt_provider.dart app/lib/utils/share_links.dart \
            app/lib/pages/capture/connect.dart app/lib/pages/home/device.dart \
            app/lib/pages/referral/referral_page.dart app/lib/pages/settings/data_privacy_page.dart
      - name: Run app unit tests
        working-directory: app
        run: |
          flutter pub get
          flutter test \
            test/unit/audio_source_test.dart \
            test/unit/audio_timeline_mapper_test.dart \
            test/unit/native_bluetooth_discovery_test.dart \
            test/unit/batch_recording_test.dart \
            test/unit/rayban_meta_source_mapping_test.dart \
            test/unit/service_manager_device_start_test.dart \
            test/unit/local_auth_test.dart \
            test/unit/env_test.dart \
            test/unit/selfhost_payment_policy_test.dart \
            test/unit/stt_mode_resolver_test.dart \
            test/unit/pure_socket_auth_test.dart \
            test/unit/account_cutover_gate_test.dart \
            test/unit/share_links_test.dart \
            test/unit/multipart_401_retry_test.dart \
            test/unit/transient_network_error_test.dart \
            test/widgets/connect_device_get_omi_test.dart \
            test/widgets/authenticated_product_scope_test.dart \
            test/widgets/record_options_sheet_icon_test.dart \
            test/services/capture/stt_mode_capture_entry_test.dart \
            test/providers/speech_profile_provider_test.dart
      - name: Run native BLE endpoint tests
        working-directory: app/android
        run: |
          ./gradlew :app:testDevDebugUnitTest \
            --tests 'com.friend.ios.batch.NativeBleServerEndpointPolicyTest' \
            --tests 'com.friend.ios.batch.OmiBackgroundAudioStreamerTest' \
            --tests 'com.friend.ios.batch.OmiBleFrameAssemblerTest' \
            --tests 'com.friend.ios.batch.NativeBleGeolocationHeaderTest' \
            --no-daemon
      - name: Compile the complete debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: app
        run: |
          flutter build apk --debug --flavor dev --target-platform android-arm64,android-x64
      - name: Upload debug APK for device validation
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ollomi-android-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-dev-debug.apk
          if-no-files-found: error

  container-images:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    needs: [backend-tests, android-tests]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # `ollomi-backend` and `ollomi-speech` were packages left behind by
          # the deleted pre-fork repository. New names make the published
          # packages independently owned by this public fork.
          - name: api
            context: .
            file: deploy/Dockerfile
          - name: stt
            context: services/speech
            file: services/speech/Dockerfile
          - name: voiceprint
            context: .
            file: services/voiceprint/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ollomi-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # The self-hosted compose stack targets the native amd64 runner.
          # Avoid QEMU's external binfmt image so publishing remains reliable.
          platforms: linux/amd64
          # Pull requests build every deliverable, including the optional
          # owner-voice image, but cannot publish packages from unreviewed code.
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  android-apk:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    # Build the release candidate alongside the test jobs. The release job
    # still waits for Android and backend validation before publishing it.
    # A normal main push must remain testable before the fork owner has
    # provisioned its private signing material. Signed distribution is an
    # explicit versioned release operation.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          cache: true
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ollomi-release.jks"
      - name: Build release APK
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ollomi-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          build_number=$((100000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --flavor prod --target-platform android-arm64,android-x64 \
            --build-name="1.0.${GITHUB_RUN_NUMBER}" --build-number="$build_number"
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-prod-release.apk release-artifacts/ollomi.apk
          cd release-artifacts
          sha256sum ollomi.apk > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ollomi-android-release
          path: app/release-artifacts/
          if-no-files-found: error

  backend-bundle:
    name: Assemble backend release bundle
    runs-on: ubuntu-latest
    needs: [container-images]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package the external-AI Compose installation
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          stage="$RUNNER_TEMP/ollomi-backend"
          mkdir -p "$stage/scripts" release-artifacts
          cp deploy/examples/external-api/compose.yaml "$stage/compose.yaml"
          sed \
            -e "s|^OLLOMI_IMAGE_OWNER=.*|OLLOMI_IMAGE_OWNER=${IMAGE_OWNER}|" \
            -e "s|^OLLOMI_IMAGE_TAG=.*|OLLOMI_IMAGE_TAG=${RELEASE_TAG}|" \
            deploy/examples/external-api/env.example > "$stage/.env.example"
          cp deploy/release/INSTALL.md "$stage/INSTALL.md"
          cp scripts/selfhost_backup.sh scripts/selfhost_restore.sh "$stage/scripts/"
          chmod 700 "$stage/scripts/selfhost_backup.sh" "$stage/scripts/selfhost_restore.sh"
          tar -C "$RUNNER_TEMP" -czf release-artifacts/ollomi-backend.tar.gz ollomi-backend
          cd release-artifacts
          sha256sum ollomi-backend.tar.gz > ollomi-backend.tar.gz.sha256
          sha256sum -c ollomi-backend.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ollomi-backend-release
          path: release-artifacts/
          if-no-files-found: error

  release-publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [backend-tests, android-tests, container-images, android-apk, backend-bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ollomi-android-release
          path: release-artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: ollomi-backend-release
          path: release-artifacts/backend
      - name: Verify release checksums
        run: |
          (cd release-artifacts/android && sha256sum -c SHA256SUMS)
          (cd release-artifacts/backend && sha256sum -c ollomi-backend.tar.gz.sha256)
      - name: Create the public release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/android/ollomi.apk
            release-artifacts/android/SHA256SUMS
            release-artifacts/backend/ollomi-backend.tar.gz
            release-artifacts/backend/ollomi-backend.tar.gz.sha256
