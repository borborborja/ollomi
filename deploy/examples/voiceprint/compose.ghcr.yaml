# CPU-only own-voice service using the reviewed image published by this fork.
# Keep it on the model server and make its port reachable only by Ollomi's
# backend over a private network or a separately managed HTTPS proxy.
name: ollomi-voiceprint

services:
  voiceprint:
    image: ghcr.io/${OLLOMI_IMAGE_OWNER:?Set OLLOMI_IMAGE_OWNER to the owner of your Ollomi fork}/ollomi-voiceprint:${OLLOMI_IMAGE_TAG:?Set OLLOMI_IMAGE_TAG to a reviewed Ollomi release}
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment:
      HF_HOME: /models/huggingface
      XDG_CACHE_HOME: /models/cache
    ports: ['${VOICEPRINT_BIND:-127.0.0.1}:${VOICEPRINT_PORT:-8091}:8091']
    volumes: [model-cache:/models]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8091/health")']
      start_period: 90s
      interval: 30s
      timeout: 10s
      retries: 6

volumes:
  model-cache:
