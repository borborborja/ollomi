# Standalone Ollomi deployment using the images built by GitHub Actions.
# This variant contains no Whisper or Ollama container and needs no model files.
name: ollomi

x-backend: &backend
  image: ghcr.io/${OLLOMI_IMAGE_OWNER:?Set OLLOMI_IMAGE_OWNER to the owner of your Ollomi fork}/ollomi-backend:${OLLOMI_IMAGE_TAG:?Set OLLOMI_IMAGE_TAG to a reviewed Ollomi release}
  restart: unless-stopped
  init: true
  env_file: [.env]
  environment: &backend-environment
    OLLOMI_DATABASE_URL: postgresql+psycopg://ollomi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres/ollomi
    OLLOMI_REDIS_URL: redis://redis:6379/0
    OLLOMI_TYPESENSE_URL: http://typesense:8108
    OLLOMI_TYPESENSE_KEY: ${TYPESENSE_API_KEY:?Set TYPESENSE_API_KEY}
  volumes: [audio:/data]
  networks: [private, inference]
  security_opt: [no-new-privileges:true]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ollomi
      POSTGRES_DB: ollomi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U ollomi -d ollomi]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: [redis-server, --appendonly, 'yes']
    restart: unless-stopped
    volumes: [redis:/data]
    networks: [private]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  typesense:
    image: typesense/typesense:29.0@sha256:316b7e71c21f7e5e5caa8daa150e1b3f2be8c876081ee1f77bc2d92cd7f137d0
    command: [--data-dir, /data, --api-key, '${TYPESENSE_API_KEY}', --enable-cors=false]
    restart: unless-stopped
    volumes: [search:/data]
    networks: [private]

  migrate:
    <<: *backend
    restart: 'no'
    command: [python, -m, selfhost.cli, migrate]

  ollomi-api:
    <<: *backend
    ports: ['${OLLOMI_BIND:-127.0.0.1}:${OLLOMI_PORT:-8090}:8080']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/health/ready")']
      interval: 15s
      timeout: 5s
      retries: 10

  # Optional public HTTPS endpoint. Caddy obtains and renews the certificate;
  # keep OLLOMI_BIND loopback-only when this profile is enabled.
  proxy-tls:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: [public-tls]
    restart: unless-stopped
    init: true
    # Keep the TLS profile optional at Compose-configuration time, but fail
    # closed at *profile start* if the operator forgot the public DNS name.
    # Passing an empty --from directly to Caddy would silently start plain
    # HTTP on :80, which is never an acceptable MCP OAuth endpoint.
    environment:
      OLLOMI_TLS_DOMAIN: ${OLLOMI_TLS_DOMAIN:-}
    command:
      - /bin/sh
      - -ec
      - 'test -n "$$OLLOMI_TLS_DOMAIN" || { echo "OLLOMI_TLS_DOMAIN is required by the public-tls profile" >&2; exit 64; }; exec caddy reverse-proxy --from "$$OLLOMI_TLS_DOMAIN" --to ollomi-api:8080'
    ports:
      - '${OLLOMI_TLS_BIND:-0.0.0.0}:${OLLOMI_HTTP_PORT:-80}:80'
      - '${OLLOMI_TLS_BIND:-0.0.0.0}:${OLLOMI_HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [private, ingress]
    depends_on:
      ollomi-api: {condition: service_healthy}

  worker:
    <<: *backend
    command: [celery, -A, selfhost.worker.celery, worker, --loglevel=INFO, --concurrency=2]
    depends_on:
      migrate: {condition: service_completed_successfully}

  scheduler:
    <<: *backend
    command: [celery, -A, selfhost.worker.celery, beat, --loglevel=INFO, --schedule=/data/celerybeat]
    depends_on:
      migrate: {condition: service_completed_successfully}

networks:
  private:
    internal: true
  inference:
  ingress:

volumes:
  postgres:
  redis:
  audio:
  search:
  caddy-data:
  caddy-config:
